name: Landing auto-deploy

# F178 Lag 3 — auto-deploy trail-landing on push to main when content,
# public assets, or build/deploy config change. Closes the "I committed
# but live shows old content" bug class from 2026-05-02.
#
# Trigger paths are intentionally narrow:
#   - apps/landing/content/**     posts, pages, categories
#   - apps/landing/public/**      uploads, SVGs, static assets
#   - apps/landing/build.ts       SSG itself
#   - apps/landing/Dockerfile     deploy image
#   - apps/landing/fly.toml       Fly config
#   - apps/landing/package.json   scripts (this file)
#
# Explicitly NOT triggered by:
#   - apps/landing/deploy/**      build output (CI builds fresh)
#   - apps/landing/_data/**       runtime CMS state (audit/server logs)

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/content/**'
      - 'apps/landing/public/**'
      - 'apps/landing/build.ts'
      - 'apps/landing/Dockerfile'
      - 'apps/landing/fly.toml'
      - 'apps/landing/package.json'
      - '.github/workflows/landing-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # apps/landing is explicitly excluded from the root pnpm
      # workspace (see pnpm-workspace.yaml: '!apps/landing') so
      # `pnpm install` at the repo root does not populate
      # apps/landing/node_modules. Install in-place instead — landing
      # has a tiny standalone dep set (marked, tsx, zod, @webhouse/cms).
      - name: Install landing dependencies
        working-directory: apps/landing
        run: npm install --no-package-lock

      - name: Build static site (Zod schema enforced)
        working-directory: apps/landing
        run: npm run build

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        working-directory: apps/landing
        # F196.3 — the sha MUST be baked in. Without it report-deploy.sh posts
        # sha="unknown" with deploy_id "unknown-<site>", and because the
        # registry is idempotent on deploy_id that lie is written ONCE and can
        # never be corrected. The local `pnpm ship:*` path already passes it.
        run: flyctl deploy --remote-only --config fly.toml --build-arg GIT_SHA="${GITHUB_SHA::7}" .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
