<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trail — Admin redesign</title>
<link rel="stylesheet" href="src/styles.css" />
<link rel="icon" type="image/svg+xml" href="uploads/trail-logo.svg" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/data.js"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/login.jsx"></script>
<script type="text/babel" src="src/tenant-switcher.jsx"></script>
<script type="text/babel" src="src/user-menu.jsx"></script>
<script type="text/babel" src="src/command-palette.jsx"></script>
<script type="text/babel" src="src/top-nav.jsx"></script>
<script type="text/babel" src="src/home.jsx"></script>
<script type="text/babel" src="src/trail-sidebar.jsx"></script>
<script type="text/babel" src="src/manage-tenants.jsx"></script>
<script type="text/babel" src="src/user-settings.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
  // Wait for all Babel scripts to mount, then render.
  function mount() {
    if (!window.TrailApp) { setTimeout(mount, 30); return; }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.TrailApp />);
  }
  mount();
</script>
</body>
</html>
