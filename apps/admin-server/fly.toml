# F33 Phase 1B — trail-admin on Fly.io
# Org: broberg-ai, region: arn (per CLAUDE.md global Trail policy).

app = "trail-admin"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  TRAIL_DATA_DIR = "/data"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Admin must always have ≥1 warm machine. Auto-stop+cold-start was
  # observed to drop sessions mid-flight (in-flight INSERTs into
  # control.db's WAL hadn't synced yet) and cause OAuth state cookies
  # to drift between start/callback machine instances. Tiny cost
  # increase (~$2-5/mo) eliminates the entire class of bugs.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 256 MB is fine for control.db (small) + Hono. Bump if SPA ssr or
  # heavy proxy buffering becomes a thing.
  memory_mb = 256

[mounts]
  source = "trail_admin_data"
  destination = "/data"

[checks]
  [checks.health]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
